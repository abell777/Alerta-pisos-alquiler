name: Vigilar pisos

on:
  schedule:
    # cada 5 minutos. GitHub Actions no garantiza exactitud al segundo,
    # a veces tarda algo más — es normal y suficiente para este proyecto.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # te deja lanzarlo a mano desde la pestaña "Actions" de GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar el scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py

      - name: Guardar vistos.json actualizado
        run: |
          git config user.name "bot-alertas-pisos"
          git config user.email "bot@example.com"
          git add vistos.json
          git diff --cached --quiet || git commit -m "Actualiza anuncios vistos [skip ci]"
          git push
